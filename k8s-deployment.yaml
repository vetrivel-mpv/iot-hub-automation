apiVersion: v1
kind: Namespace
metadata:
  name: iot-hub-automation
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iot-hub-automation-deployment
  namespace: iot-hub-automation
  labels:
    app: iot-hub-automation
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: iot-hub-automation
  template:
    metadata:
      labels:
        app: iot-hub-automation
    spec:
      containers:
        - name: iot-hub-automation-portal
          image: iot-hub-automation:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3030
              name: http
          env:
            - name: PORT
              value: "3030"
            - name: NODE_ENV
              value: "production"
            - name: CI
              value: "true"
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3030
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3030
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: reports-persistent-storage
              mountPath: /app/reports
      volumes:
        - name: reports-persistent-storage
          persistentVolumeClaim:
            claimName: iot-hub-reports-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: iot-hub-reports-pvc
  namespace: iot-hub-automation
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: iot-hub-automation-service
  namespace: iot-hub-automation
spec:
  type: ClusterIP
  selector:
    app: iot-hub-automation
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3030
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iot-hub-automation-ingress
  namespace: iot-hub-automation
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  rules:
    - host: iothub-automation.internal.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: iot-hub-automation-service
                port:
                  number: 80
