<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c1b"/>
      <stop offset="100%" stop-color="#101d3b"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="45%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Full-Bleed Squircle: Fills 100% of tab space -->
  <rect x="0" y="0" width="64" height="64" rx="13" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="11.5" fill="none" stroke="#00f5ff" stroke-width="2.5" stroke-opacity="0.9"/>

  <!-- Thick High-Contrast IoT Network Spoke Traces -->
  <line x1="32" y1="32" x2="14" y2="14" stroke="#00f5ff" stroke-width="5.5" stroke-linecap="round"/>
  <line x1="32" y1="32" x2="50" y2="14" stroke="#00f5ff" stroke-width="5.5" stroke-linecap="round"/>
  <line x1="32" y1="32" x2="14" y2="50" stroke="#38bdf8" stroke-width="5.5" stroke-linecap="round"/>
  <line x1="32" y1="32" x2="50" y2="50" stroke="#10b981" stroke-width="5.5" stroke-linecap="round"/>

  <!-- 4 Big Corner Satellite Nodes -->
  <!-- Top Left: Electric Cyan -->
  <circle cx="14" cy="14" r="7.5" fill="#00f5ff"/>
  <circle cx="14" cy="14" r="3.5" fill="#ffffff"/>

  <!-- Top Right: Sky Blue -->
  <circle cx="50" cy="14" r="7.5" fill="#38bdf8"/>
  <circle cx="50" cy="14" r="3.5" fill="#ffffff"/>

  <!-- Bottom Left: Royal Blue -->
  <circle cx="14" cy="50" r="7.5" fill="#3b82f6"/>
  <circle cx="14" cy="50" r="3.5" fill="#ffffff"/>

  <!-- Bottom Right: Emerald Live Pulse -->
  <circle cx="50" cy="50" r="8" fill="#10b981"/>
  <circle cx="50" cy="50" r="3.5" fill="#ffffff"/>

  <!-- Extra Orbit Accent Ring -->
  <circle cx="32" cy="32" r="19" fill="none" stroke="#00f5ff" stroke-width="1.8" stroke-dasharray="4 2.5" opacity="0.65"/>

  <!-- Bold Central IoT Hub Core (Radius 14.5 = 29px diameter) -->
  <circle cx="32" cy="32" r="14.5" fill="url(#coreGrad)" stroke="#ffffff" stroke-width="2.5"/>

  <!-- High-Visibility Sharp Center Lightning Bolt (⚡) -->
  <path d="M34.5 21.5 L26 32.5 L32 32.5 L29.5 42.5 L38 31.5 L32.5 31.5 Z" fill="#ffffff"/>
</svg>
