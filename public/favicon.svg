<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Modern Dark Squircle Base with Cyan Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="2.5"/>

  <!-- Orbital Ring (IoT Telemetry Mesh) -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="url(#ringGrad)" stroke-width="1.8" stroke-dasharray="4 3" opacity="0.8"/>
  <circle cx="32" cy="32" r="13" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.35"/>

  <!-- Hub Connection Traces -->
  <!-- Top Node Trace -->
  <line x1="32" y1="32" x2="32" y2="13" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Bottom Left Node Trace -->
  <line x1="32" y1="32" x2="15" y2="43" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Bottom Right Node Trace -->
  <line x1="32" y1="32" x2="49" y2="43" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Satellite Nodes -->
  <!-- North Node: Cyan -->
  <circle cx="32" cy="13" r="4.5" fill="#00f2fe" filter="url(#glow)"/>
  <circle cx="32" cy="13" r="2" fill="#ffffff"/>

  <!-- South-West Node: Blue -->
  <circle cx="15" cy="43" r="4.2" fill="#38bdf8"/>
  <circle cx="15" cy="43" r="1.8" fill="#ffffff"/>

  <!-- South-East Node: Emerald Live Pulse -->
  <circle cx="49" cy="43" r="4.5" fill="#10b981" filter="url(#glow)"/>
  <circle cx="49" cy="43" r="2" fill="#ecfdf5"/>

  <!-- Central Hub Core with Neon Glow -->
  <circle cx="32" cy="32" r="9.5" fill="url(#coreGrad)" stroke="#67e8f9" stroke-width="2" filter="url(#glow)"/>
  
  <!-- Central Pulse Energy Bolt (⚡ Automation Execution) -->
  <path d="M33.5 26 L28.5 32.5 L32 32.5 L30.5 38 L36.5 31.5 L33 31.5 Z" fill="#ffffff"/>
</svg>
